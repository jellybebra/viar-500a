name: Build and release DEB

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install verification libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk

      - name: Set release version
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          version="0.4.3+git.${GITHUB_RUN_NUMBER}.${short_sha}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "DEB=viar-scanner_${version}_amd64.deb" >> "$GITHUB_ENV"
          echo "TAG=build-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_ENV"

      - name: Build Debian 10 compatible standalone package
        shell: bash
        run: |
          docker run --rm \
            --env VERSION \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian:buster-slim \
            sh -euxc '
              printf "%s\n" \
                "deb http://archive.debian.org/debian buster main" \
                "deb http://archive.debian.org/debian buster-updates main" \
                "deb http://archive.debian.org/debian-security buster/updates main" \
                > /etc/apt/sources.list
              printf "%s\n" \
                "Acquire::Check-Valid-Until \"false\";" \
                > /etc/apt/apt.conf.d/99archive
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install --yes \
                binutils ca-certificates python3 python3-dev python3-venv python3-tk
              sh scripts/build-standalone-deb.sh "$VERSION"
            '

      - name: Verify package
        shell: bash
        run: |
          test -s "$DEB"
          dpkg-deb --info "$DEB"
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          dpkg-deb --extract "$DEB" "$test_root"
          for library in \
            libfontconfig.so.1 libfreetype.so.6 libpng16.so.16 \
            libtcl8.6.so libtk8.6.so libX11.so.6 libXau.so.6 \
            libXdmcp.so.6 libXext.so.6 libXft.so.2 libXrender.so.1 \
            libXss.so.1
          do
            test ! -e "$test_root/opt/viar-scanner/app/_internal/$library"
          done
          max_glibc="$(
            find "$test_root/opt/viar-scanner/app" -type f -print0 |
              xargs -0 -r objdump -T 2>/dev/null |
              grep -oE 'GLIBC_[0-9]+\.[0-9]+' |
              sort -Vu |
              tail -1
          )"
          echo "Maximum required glibc symbol: $max_glibc"
          test -n "$max_glibc"
          ! dpkg --compare-versions "${max_glibc#GLIBC_}" gt "2.28"
          "$test_root/opt/viar-scanner/app/viar-scanner" --self-test
          sha256sum "$DEB"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: viar-scanner-${{ env.VERSION }}-amd64
          path: ${{ env.DEB }}
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha256="$(sha256sum "$DEB" | awk '{print $1}')"
          gh release create "$TAG" "$DEB" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VIAR Scanner ${VERSION}" \
            --latest \
            --notes "Автономный пакет для Astra Linux amd64.

          Коммит: \`${GITHUB_SHA}\`

          Установка:
          \`\`\`bash
          sudo apt install ./${DEB}
          \`\`\`

          SHA-256: \`${sha256}\`"
